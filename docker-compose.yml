services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 15
    networks: [datacloud-net]
  queue:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports: ["15672:15672"]
    volumes: [rabbitmq_data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 15
    networks: [datacloud-net]
  endpoint:
    build: ./endpoint
    ports: ["8080:8080"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    depends_on:
      queue: {condition: service_healthy}
      balancer: {condition: service_started}
    networks: [datacloud-net]
  worker:
    build: ./worker
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    depends_on:
      queue: {condition: service_healthy}
      balancer: {condition: service_started}
    networks: [datacloud-net]
  balancer:
    image: nginx:1.27-alpine
    ports: ["8081:80"]
    volumes: ["./balancer/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [node1,node2,node3]
    networks: [datacloud-net]
  node1: &node
    build: ./node
    depends_on: [platform-destino]
    networks: [datacloud-net]
  node2: *node
  node3: *node
  platform-destino:
    build: ./platform
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      COINS_MAX_BALANCE: ${COINS_MAX_BALANCE:-10000}
    depends_on:
      db: {condition: service_healthy}
    networks: [datacloud-net]
  adminer:
    image: adminer:4
    ports: ["8083:8080"]
    depends_on: [db]
    networks: [datacloud-net]
networks:
  datacloud-net:
    driver: bridge
volumes:
  postgres_data:
  rabbitmq_data:
