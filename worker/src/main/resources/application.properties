server.port=8085
spring.rabbitmq.host=queue
spring.rabbitmq.username=${RABBITMQ_DEFAULT_USER}
spring.rabbitmq.password=${RABBITMQ_DEFAULT_PASS}
spring.rabbitmq.listener.simple.concurrency=3
spring.rabbitmq.listener.simple.max-concurrency=6
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.default-requeue-rejected=false
balancer.url=http://balancer/api/transfer
balancer.failed-url=http://balancer/api/failures
# Espera entre reintentos (TTL de la cola exchange.retry) y maximo de intentos.
# 15 s x 240 intentos = 1 hora esperando a que el usuario recargue coins.
worker.retry-delay-ms=${WORKER_RETRY_DELAY_MS:15000}
worker.max-attempts=${WORKER_MAX_ATTEMPTS:240}
